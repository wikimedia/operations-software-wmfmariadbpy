[tool.pylsp-mypy]
enabled = true
live_mode = true

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
# follow_imports = "skip"
ignore_missing_imports = true
no_implicit_reexport = true
pretty = true
show_error_context = true
strict_bytes = true
strict_equality = true
# strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
# Minimum python version to support
target-version = "py311"

# Exclude commonly ignored directories
exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
]

# Same as Black
line-length = 120

[tool.ruff.lint]
select = [
    "A",  # Flake8 builtins
    "C4",  # Flake8 comprehensions
    "COM",  # Flake8 commas
    "E",  # Pycodestyle errors
    "ERA",  # Eradicate
    "EXE",  # Flake8 executable
    "F",  # Pyflakes
    "G",  # Flake8 logging format
    "I",  # Isort
    "INP",  # Flake8 no pep420
    "PIE",  # Flake8 pie
    "SLOT",  # Flake8 slots
    "T10",  # Flake8 debugger
    "T20",  # Flake8 print
    "TID",  # Flake8 tidy imports
    "TRY",  # Tryceratops
    "W",  # Pycodestyle warnings
    "YTT",  # Flake8 2020

    # "DTZ",  # Flake8 datetimez
    # "ISC",  # Flake8 implicit string concat
    # "BLE",  # Flake8 blind except                     3
    # "PL",  # Pylint                                   5
    # "SLF",  # Flake8 self - private member access     5
    # "B",  # Flake8 bugbear                           12
    # "S",  # Flake8 bandit                            21
    # "ARG",  # Flake8 unused arguments                22
    # "ANN",  # Flake8 annotations
    # "FBT",  # Flake8 boolean trap                    39
    # "PT",  # Flake8 pytest style
    # "SIM",  # Flake8 simplify
    # "PTH",  # Flake8 use pathlib
    # "RUF",  # Ruff specific rules
]

ignore = [
    "A001",
    "A002",
    "E501",
    "EXE001",
    # "ANN001",  # Missing type annotation for function argument
    # "ANN201",  # Missing return type annotation for public function
    # "ANN202",  # Missing return type annotation for private function
    # "ANN204",  # Missing return type annotation for special method `__init__`
    "ANN401",  # Allow Any type hint
    "C408",    # Unnecessary `dict()` call (rewrite as a literal)
    "COM812",  # Trailing commas enforced by the formatter
    "D200",    # One-line docstring should fit on one line
    "D205",    # 1 blank line required between summary line and description
    "D212",    # Multi-line docstring summary should start at the first line
    "D400",    # First line should end with a period
    "D415",    # First line should end with a period, question mark, or exclamation point
    "ERA001",  # Commented-out code
    "G004",    # Logging statement uses f-string
    "I001",    # Import block is un-sorted
    "PLR",     # Ignore Pylint refactor rules - we run pylint directly
    "PTH123",  # Do not force to use Path in all cases
    "Q000",    # Allow to use the built-in open() function
    "S101",    # Use of `assert` detected
    "S603",    # Subprocess calls without shell=True
    "PIE810",
    "SIM108",  # Don't force ternary operator always
    "T201",    # Allow print() calls
    "TRY003",  # Allow exception classes that don't define a common message
    "TRY300",
    "TRY400",  # Allow to log just the error message and not the full exception traceback

]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = [
    "ANN",     # Ignore type hints checks in tests
    "ARG001",  # Unused function argument
    "B011",    # Do not `assert False`
    "E501",    # Long lines
    "INP001",  # File `tests/unit/test_import.py` is part of an implicit namespace package.
    "PT015",   # Assertion always fails, replace with `pytest.fail()`
    "S101",    # Allow asserts
    "S106",    # Allow hardcoded fake passwords in tests
    "SLF",
    "TRY002",
]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = true

[tool.ruff.format]
docstring-code-format = true
